<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Sun -->
  <circle cx="380" cy="120" r="60" fill="url(#sun)"/>

  <!-- Mountains -->
  <polygon points="50,350 150,200 250,350" fill="#818cf8" opacity="0.6"/>
  <polygon points="150,350 280,180 410,350" fill="#a5b4fc" opacity="0.8"/>
  <polygon points="300,350 400,220 500,350" fill="#c7d2fe" opacity="0.7"/>

  <!-- Road -->
  <path d="M180 512 L256 280 L332 512" fill="url(#road)"/>

  <!-- Road lines -->
  <line x1="256" y1="300" x2="256" y2="340" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="360" x2="256" y2="400" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="420" x2="256" y2="460" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="480" x2="256" y2="512" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>

  <!-- Car -->
  <g transform="translate(220, 380)">
    <!-- Car body -->
    <rect x="0" y="20" width="72" height="30" rx="5" fill="#ef4444"/>
    <rect x="10" y="5" width="52" height="20" rx="8" fill="#ef4444"/>
    <!-- Windows -->
    <rect x="15" y="8" width="18" height="14" rx="3" fill="#bfdbfe"/>
    <rect x="38" y="8" width="18" height="14" rx="3" fill="#bfdbfe"/>
    <!-- Wheels -->
    <circle cx="15" cy="50" r="10" fill="#1f2937"/>
    <circle cx="57" cy="50" r="10" fill="#1f2937"/>
    <circle cx="15" cy="50" r="5" fill="#6b7280"/>
    <circle cx="57" cy="50" r="5" fill="#6b7280"/>
  </g>

  <!-- Route marker (pin) -->
  <g transform="translate(100, 100)">
    <path d="M25 0C11.2 0 0 11.2 0 25C0 43.75 25 65 25 65C25 65 50 43.75 50 25C50 11.2 38.8 0 25 0Z" fill="#10b981"/>
    <circle cx="25" cy="23" r="10" fill="white"/>
  </g>
</svg>
